<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>USA Climate Variable Explorer</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; display: flex; background: #111; }
        #sidebar { width: 380px; height: 100vh; background: #1a1a1a; color: white; padding: 25px; box-sizing: border-box; z-index: 1000; box-shadow: 2px 0 10px rgba(0,0,0,0.5); overflow-y: auto; }
        #map { flex-grow: 1; height: 100vh; background: #000; }
        h2 { margin-top: 0; color: #fcd773; }
        .control-group { margin-bottom: 20px; background: #333; padding: 15px; border-radius: 8px; }
        label { display: block; margin-bottom: 10px; font-weight: bold; font-size: 0.9em; color: whitesmoke; }
        .val-display { float: right; color: #fcd773; font-family: monospace; }
        input[type=range] { width: 100%; cursor: pointer; }
        
        .info.legend { padding: 10px; font: 12px Arial; background: rgba(30,30,30,0.9); color: white; border-radius: 5px; line-height: 18px; border: 1px solid #e7e7e7; }
        .info.legend i { width: 16px; height: 16px; float: left; margin-right: 8px; opacity: 0.8; border: 1px solid black; }
        
        /* Popup Styling for Dark Mode */
        .leaflet-popup-content-wrapper { background: #222 !important; color: #fff !important; border: 1px solid #444; }
        .leaflet-popup-tip { background: #222 !important; }
            /* This targets the entire container of the layer switcher */
        .leaflet-control-layers {
            background: rgba(0, 0, 0, 0.9) !important; /* Dark background */
            color: #ffffff !important;                   /* Main text color */
            border: 1px solid #e7e7e7 !important;           /* Subtle border */
            border-radius: 8px;
            padding: 10px}

        /* This specifically targets the labels (the text next to the radio buttons) */
        .leaflet-control-layers-list label {
            color: #ffffff !important; 
            font-size: 0.9em;
            margin-bottom: 5px;
            cursor: pointer}

        /* Optional: Changes the background when the menu is expanded */
        .leaflet-control-layers-expanded {
            background: #222222 !important;
            padding: 12px}

        /* Pro tip: Makes the text turn gold when you hover over a layer option */
        .leaflet-control-layers-list label:hover {
            color: #fcd773 !important}
    </style>
</head>
<body>

<div id="sidebar">
    <h2>SPEI, Temperature & Precipitation</h2>
    <p style="font-size: 0.85em; color: whitesmoke;">US County-level Climate Variations from the past 100 year averages (1926-2026)</p>

    <div class="control-group">
        <label>Year: <span id="yearVal" class="val-display">2026</span></label>
        <input type="range" id="yearSlider" min="1926" max="2026" value="2026">
    </div>

    <div class="control-group">
        <label>Month: <span id="monthLabel" class="val-display">March</span></label>
        <input type="range" id="monthSlider" min="1" max="12" value="3">
    </div>

    <div class="control-group">
        <label>Timescale: <span id="scaleVal" class="val-display">1 Month</span></label>
        <input type="range" id="scaleSlider" min="1" max="12" value="1">
    </div>

    <div style="background: #222; padding: 15px; border-radius: 8px; font-size: 0.9em;">
        <strong>Current Analysis Window:</strong><br>
        <span id="monthRangeVal" style="color: #fcd773;">March</span>
    </div>
</div>

<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
    let map, countyLayer, legendControl;
    let rawClimateData = null;
    let activeVar = 'spei'; // Global tracker for variable toggle
    const countyBaselines = {};

    const monthNames = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
    const stateLookup = {"01":"AL","04":"AZ","05":"AR","06":"CA","08":"CO","09":"CT","10":"DE","11":"DC","12":"FL","13":"GA","16":"ID","17":"IL","18":"IN","19":"IA","20":"KS","21":"KY","22":"LA","23":"ME","24":"MD","25":"MA","26":"MI","27":"MN","28":"MS","29":"MO","30":"MT","31":"NE","32":"NV","33":"NH","34":"NJ","35":"NM","36":"NY","37":"NC","38":"ND","39":"OH","40":"OK","41":"OR","42":"PA","44":"RI","45":"SC","46":"SD","47":"TN","48":"TX","49":"UT","50":"VT","51":"VA","53":"WA","54":"WV","55":"WI","56":"WY"};

    // Setup Dark Map
    map = L.map('map').setView([39.8, -90.0], 4);
    L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png').addTo(map);

    Promise.all([
        fetch('us_conus_climate_1926_2026.json').then(res => res.json()),
        fetch('NOAA_2026_US_Counties.json').then(res => res.json())
    ]).then(([climate, geojson]) => {
        rawClimateData = climate;
        
        // 1. Pre-calculate baselines for PET math
        Object.keys(rawClimateData).forEach(id => {
            let totalI = 0, pts = 0;
            Object.keys(rawClimateData[id]).forEach(k => {
                let tC = (rawClimateData[id][k].temp - 32) * (5/9);
                if (tC > 0) totalI += Math.pow(tC / 5, 1.514);
                pts++;
            });
            const I = (totalI / pts) * 12;
            const a = (6.75e-7 * Math.pow(I, 3)) - (7.71e-5 * Math.pow(I, 2)) + (1.792e-2 * I) + 0.49239;
            countyBaselines[id] = { I, a };
        });

        initMap(geojson);
    });

    function calculateAnomaly(fips, yr, mo, scale, type) {
        let fipsStr = String(fips).padStart(5, '0');
        let state = stateLookup[fipsStr.substring(0, 2)];
        let id = state + "-" + fipsStr.substring(2, 5);
        if (!rawClimateData[id]) return 0;

        const base = countyBaselines[id];

        function getVal(targetYr, targetMo) {
            let sum = 0, count = 0;
            for (let i = 0; i < scale; i++) {
                let d = targetMo - i, y = parseInt(targetYr);
                while (d <= 0) { d += 12; y -= 1; }
                let k = y + String(d).padStart(2, '0');
                let e = rawClimateData[id][k];
                if (e) {
                    if (type === 'temp') sum += e.temp;
                    else if (type === 'precip') sum += e.precip;
                    else { // SPEI
                        let tC = (e.temp - 32) * (5/9);
                        let pet = (tC > 0) ? 16 * Math.pow((10 * tC) / base.I, base.a) : 0;
                        sum += (e.precip * 25.4 - pet);
                    }
                    count++;
                }
            }
            return count === scale ? sum : null;
        }

        let curr = getVal(yr, mo);
        if (curr === null) return 0;

        let hist = [];
        for (let y = 1926; y <= 2026; y++) {
            let v = getVal(y, mo);
            if (v !== null) hist.push(v);
        }
        const mean = hist.reduce((a, b) => a + b, 0) / hist.length;
        const std = Math.sqrt(hist.map(x => Math.pow(x - mean, 2)).reduce((a, b) => a + b, 0) / hist.length);
        return std > 0 ? (curr - mean) / std : 0;
    }

    function getColors(val) {
        if (activeVar === 'spei') {
            return val <= -2.0 ? '#790909' : val <= -1.6 ? '#EB0000' : val <= -1.3 ? '#F5BA18' : val <= -0.8 ? '#FCD773' : val <= -0.5 ? '#ECF30E' : val >= 2.0 ? '#110981' : val >= 1.6 ? '#151BDC' : val >= 1.3 ? '#1586DC' : val >= 0.8 ? '#0EF3F3' : val >= 0.5 ? '#9FF30E' : '#FFFFFF';
        } else if (activeVar === 'temp') {
            // White to Red for Hotter
            return val >= 2.0 ? '#a50f15' : val >= 1.3 ? '#de2d26' : val >= 0.7 ? '#fb6a4a' : val >= 0.3 ? '#fcae91' : val > -0.3 ? '#fee5d9' : '#ffffff';
        } else {
            // White to Blue for Wetter
            return val >= 2.0 ? '#084594' : val >= 1.3 ? '#2171b5' : val >= 0.7 ? '#4292c6' : val >= 0.3 ? '#6baed6' : val > -0.3 ? '#bdd7e7' : '#ffffff';
        }
    }

    function initMap(geojson) {
        countyLayer = L.geoJson(geojson, {
            style: (f) => ({ fillColor: getColors(calculateAnomaly(f.properties.FIPS || f.properties.GEOID, document.getElementById('yearSlider').value, document.getElementById('monthSlider').value, document.getElementById('scaleSlider').value, activeVar)), weight: 0.3, color: '#444', fillOpacity: 0.8 }),
            onEachFeature: (feature, layer) => {
                layer.bindPopup(() => {
                    const yr = document.getElementById('yearSlider').value;
                    const mo = parseInt(document.getElementById('monthSlider').value);
                    const sc = parseInt(document.getElementById('scaleSlider').value);
                    const fips = feature.properties.FIPS || feature.properties.GEOID;
                    
                    let fipsStr = String(fips).padStart(5, '0');
                    let st = stateLookup[fipsStr.substring(0, 2)];
                    let id = st + "-" + fipsStr.substring(2, 5);
                    
                    let totalT = 0, totalP = 0, c = 0;
                    for (let i = 0; i < sc; i++) {
                        let d = mo - i, y = parseInt(yr);
                        while (d <= 0) { d += 12; y -= 1; }
                        let entry = rawClimateData[id][y + String(d).padStart(2, '0')];
                        if (entry) { totalT += entry.temp; totalP += entry.precip; c++; }
                    }

                    return `<b>${feature.properties.COUNTYNAME}, ${st}</b><hr>
                            <b>SPEI:</b> ${calculateAnomaly(fips, yr, mo, sc, 'spei').toFixed(2)}<br>
                            <b>Avg Temp:</b> ${(totalT/c).toFixed(1)}°F<br>
                            <b>Avg Precip:</b> ${(totalP/c).toFixed(2)} in/mo`;
                });
            }
        }).addTo(map);

        // --- LAYER CONTROL ---
        const variableSelection = {
            "Drought (SPEI)": L.layerGroup().addTo(map),
            "Temperature Anomaly": L.layerGroup(),
            "Precipitation Anomaly": L.layerGroup()
        };
        L.control.layers(variableSelection, null, { collapsed: false }).addTo(map);

        map.on('baselayerchange', (e) => {
            if (e.name.includes("Drought")) activeVar = 'spei';
            else if (e.name.includes("Temperature")) activeVar = 'temp';
            else activeVar = 'precip';
            updateUI();
            updateLegend();
        });

        updateLegend();
        updateUI();
    }

    function updateLegend() {
        if (legendControl) map.removeControl(legendControl);
        legendControl = L.control({position: 'topright'});
        legendControl.onAdd = function() {
            let div = L.DomUtil.create('div', 'info legend');
            let titles = { spei: "Drought (SPEI)", temp: "Temp Anomaly", precip: "Precip Anomaly" };
            let colors, labels;

            if (activeVar === 'spei') {
                colors = ['#790909', '#EB0000', '#F5BA18', '#FCD773', '#ECF30E', '#FFFFFF', '#9FF30E', '#0EF3F3', '#1586DC', '#151BDC', '#110981'];
                labels = ["D4", "D3", "D2", "D1", "D0", "Normal", "W0", "W1", "W2", "W3", "W4"];
            } else if (activeVar === 'temp') {
                colors = ['#a50f15', '#de2d26', '#fb6a4a', '#fcae91', '#fee5d9', '#ffffff'];
                labels = ["Very Hot", "Hot", "Above Avg", "Slightly Above", "Normal", "Colder"];
            } else {
                colors = ['#084594', '#2171b5', '#4292c6', '#6baed6', '#bdd7e7', '#ffffff'];
                labels = ["Very Wet", "Wet", "Above Avg", "Slightly Above", "Normal", "Drier"];
            }

            div.innerHTML = `<strong>${titles[activeVar]}</strong><br>`;
            for (let i = 0; i < colors.length; i++) {
                div.innerHTML += `<i style="background:${colors[i]}"></i> ${labels[i]}<br>`;
            }
            return div;
        };
        legendControl.addTo(map);
    }

    function updateUI() {
        const yr = document.getElementById('yearSlider').value;
        const mo = parseInt(document.getElementById('monthSlider').value);
        const sc = parseInt(document.getElementById('scaleSlider').value);
        
        document.getElementById('yearVal').innerText = yr;
        document.getElementById('monthLabel').innerText = monthNames[mo - 1];
        document.getElementById('scaleVal').innerText = sc + (sc === 1 ? " Month" : " Months");

        let start = new Date(yr, mo - 1);
        start.setMonth(start.getMonth() - (sc - 1));
        document.getElementById('monthRangeVal').innerText = (sc === 1) ? monthNames[mo-1] : `${monthNames[start.getMonth()]} to ${monthNames[mo-1]}`;

        if (countyLayer) countyLayer.setStyle((f) => ({ fillColor: getColors(calculateAnomaly(f.properties.FIPS || f.properties.GEOID, yr, mo, sc, activeVar)) }));
    }

    document.querySelectorAll('input').forEach(i => i.onchange = updateUI);
</script>
</body>
</html>
