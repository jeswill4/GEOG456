    <h4>Homework 4: Loading in Global Dam Watch Dataset</h4>

    <div id="mapid"> </div>
    <style>
        #mapid{width: 95vw; 
            height: 85vh; 
            margin: auto;
        }
    </style>   
 
    <script>
        
        //Copied from homework 3
        function circleIcon(){
        var geojsonMarkerOptions = {
        radius: 7,
        fillColor: "#00f",
        color: "#000",
        weight: 1,
        opacity: 1,
        fillOpacity: 0.75
        };
        return geojsonMarkerOptions;
        }


        // put view over US, could redo this to start in asia? 
        var map = L.map('mapid').setView([35.94, -79.0], 4); 
    
        // Leaflet basemap variables
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'}).addTo(map);
        
        // Prepping data for map view 
        L.geoJSON(data, {
            pointToLayer: function (feature, latlng) {
            return L.circleMarker(latlng, circleIcon()).addTo(map);
            }});
        
    </script>
