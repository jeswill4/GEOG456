<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.8.0/dist/leaflet.css"
    integrity="sha512-hoalWLoI8r4UszCkZ5kL8vayOGVae1oxXe/2A4AO6J9+580uKHDO3JdHb7NzwwzK5xr/Fs0W40kiNHxM9vyTtQ=="
    crossorigin=""/>
    <script src="https://unpkg.com/leaflet@1.8.0/dist/leaflet.js"
    integrity="sha512-BB3hKbKWOc9Ez/TAwyWxNXeoV9c1v6FIeYiBieIWkpLjauysF18NzgR1MBNBXf8/KABdlkX68nAhlwcDFLGPCQ=="
    crossorigin=""></script>
    <title>Dam Slider</title>
    <script src="./dams_shortened.js"></script>
</head> 
<body>

<h2>Homework 5: Barriers Dataset</h4>
<p>1985 was the start of satellite data collected, any year before that is attributed to the dam being 
    built before 1985. This slider shows added barriers built each year.</p>
<h3 id="time_built">1985</h3>
<input id="mySlider" type="range" name="dates" value="0" min="0" max="41" oninput="moveSlider(this.value)">
    <div id="mapid"> </div>
    <style>
        #mapid{width: 95vw; 
            height: 70vh; 
            margin: auto;
        }
    </style>  

<script>
    function circleIcon(){
        var geojsonMarkerOptions = {
            radius: 7,
            fillColor: "#00f",
            color: "#000",
            weight: 1,
            opacity: 1,
            fillOpacity: 0.75
        };
        return geojsonMarkerOptions;
    }

    var map = L.map('mapid').setView([35.94, -79.0], 4); 

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'}).addTo(map);
    
    var date_array = ['1985', '1986', '1987', '1988', '1989', '1990', '1991', '1992', '1993', '1994', '1995',
'1996', '1997', '1998', '1999', '2000', '2001', '2002', '2003', '2004', '2005', '2006', '2007', '2008', '2009',
'2010', '2011', '2012', '2013', '2014', '2015', '2016', '2017', '2018', '2019', '2020', '2021', '2022', '2023',
'2024', '2025', '2026']

    var y1985 = [];
    var y1986 = [];
    var y1987 = [];
    var y1988 = [];
    var y1989 = [];
    var y1990 = [];
    var y1991 = [];
    var y1992 = [];
    var y1993 = [];
    var y1994 = [];
    var y1995 = [];
    var y1996 = [];
    var y1997 = [];
    var y1998 = [];
    var y1999 = [];
    var y2000 = [];
    var y2001 = [];
    var y2002 = [];
    var y2003 = [];
    var y2004 = [];
    var y2005 = [];
    var y2006 = [];
    var y2007 = [];
    var y2008 = [];
    var y2009 = [];
    var y2010 = [];
    var y2011 = [];
    var y2012 = [];
    var y2013 = [];
    var y2014 = [];
    var y2015 = [];
    var y2016 = [];
    var y2017 = [];
    var y2018 = [];
    var y2019 = [];
    var y2020 = [];
    var y2021 = [];
    var y2022 = [];
    var y2023 = [];
    var y2024 = [];
    var y2025 = [];
    var y2026 = [];

    function ordered(e) {
        var year_txt = e.properties.YEAR_TXT.slice(-4);
        if (year_txt <= '1985') { y1985.push(e); }
        if (year_txt <= '1986') { y1986.push(e); }
        if (year_txt <= '1987') { y1987.push(e); }
        if (year_txt <= '1988') { y1988.push(e); }
        if (year_txt <= '1989') { y1989.push(e); }
        if (year_txt <= '1990') { y1990.push(e); }
        if (year_txt <= '1991') { y1991.push(e); }
        if (year_txt <= '1992') { y1992.push(e); }
        if (year_txt <= '1993') { y1993.push(e); }
        if (year_txt <= '1994') { y1994.push(e); }
        if (year_txt <= '1995') { y1995.push(e); }
        if (year_txt <= '1996') { y1996.push(e); }
        if (year_txt <= '1997') { y1997.push(e); }
        if (year_txt <= '1998') { y1998.push(e); }
        if (year_txt <= '1999') { y1999.push(e); }
        if (year_txt <= '2000') { y2000.push(e); }
        if (year_txt <= '2001') { y2001.push(e); }
        if (year_txt <= '2002') { y2002.push(e); }
        if (year_txt <= '2003') { y2003.push(e); }
        if (year_txt <= '2004') { y2004.push(e); }
        if (year_txt <= '2005') { y2005.push(e); }
        if (year_txt <= '2006') { y2006.push(e); }
        if (year_txt <= '2007') { y2007.push(e); }
        if (year_txt <= '2008') { y2008.push(e); }
        if (year_txt <= '2009') { y2009.push(e); }
        if (year_txt <= '2010') { y2010.push(e); }
        if (year_txt <= '2011') { y2011.push(e); }
        if (year_txt <= '2012') { y2012.push(e); }
        if (year_txt <= '2013') { y2013.push(e); }
        if (year_txt <= '2014') { y2014.push(e); }
        if (year_txt <= '2015') { y2015.push(e); }
        if (year_txt <= '2016') { y2016.push(e); }
        if (year_txt <= '2017') { y2017.push(e); }
        if (year_txt <= '2018') { y2018.push(e); }
        if (year_txt <= '2019') { y2019.push(e); }
        if (year_txt <= '2020') { y2020.push(e); }
        if (year_txt <= '2021') { y2021.push(e); }
        if (year_txt <= '2022') { y2022.push(e); }
        if (year_txt <= '2023') { y2023.push(e); }
        if (year_txt <= '2024') { y2024.push(e); }
        if (year_txt <= '2025') { y2025.push(e); }
        if (year_txt <= '2026') { y2026.push(e); }
    };

    data.features.forEach(element => {ordered(element)});
    
    var myData = [y1985, y1986, y1987, y1988, y1989, y1990, y1991, y1992, y1993, y1994, y1995, 
    y1996, y1997, y1998, y1999, y2000, y2001, y2002, y2003, y2004, y2005, y2006, y2007, y2008, 
    y2009, y2010, y2011, y2012, y2013, y2014, y2015, y2016, y2017, y2018, y2019, y2020, y2021, 
    y2022, y2023, y2024, y2025, y2026];

    var barriers;
    
    function moveSlider(value){  
        var dates = myData[value];
        document.getElementById("time_built").innerHTML = date_array[value];
        if (barriers) {map.removeLayer(barriers)};
        barriers = L.geoJSON(dates, {
            pointToLayer: function (feature, latlng) {
                return L.circleMarker(latlng, circleIcon())}}).addTo(map);
    }
    moveSlider(0);
</script>
</body>
</html>
